name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + test
    runs-on: [self-hosted, azure-ephemeral]
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # The azure-ephemeral runners are Nix-based and ship no toolchain on PATH,
      # so the Rust toolchain comes from the flake devshell (nix develop) rather
      # than a downloaded rustup toolchain (which would not run under NixOS).
      - name: rustfmt
        run: nix develop --command cargo fmt --all --check

      - name: clippy
        run: nix develop --command cargo clippy --all-targets -- -D warnings

      - name: test
        run: nix develop --command cargo test

  windows:
    name: Windows compile + test
    # updatable-cli is not yet in collective's self-hosted Windows runner allowlist.
    # Use the native MSVC GitHub runner now; switch to [self-hosted, windows] once it is.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify native MSVC host
        shell: pwsh
        run: |
          rustc -vV
          if (-not ((rustc -vV) -match "host: x86_64-pc-windows-msvc")) {
            throw "expected native x86_64-pc-windows-msvc toolchain"
          }

      - name: Compile and test all targets
        shell: pwsh
        run: |
          cargo test --all-targets --locked
          cargo test --doc --locked
