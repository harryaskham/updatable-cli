name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + test
    # These labels must match runners actually registered on this repo. Targeting a label no
    # runner carries does not fail fast: the job queues for 24h and is then cancelled, which
    # reads as an infrastructure flake rather than "nothing can run this" (bd-a5b044 — the
    # previous `azure-ephemeral` target left the Unix lane dark from 2026-07-13 to 2026-07-30
    # while eight idle nix runners were online — seven Linux, one macOS). Verify with:
    #   gh api repos/harryaskham/updatable-cli/actions/runners --jq '.runners[].labels[].name'
    #
    # timeout-minutes below does NOT bound that: it is execution time only and does not start
    # counting while a job is queued. Queue wait has a separate 24h limit that cannot be set
    # from the workflow, so a wrong label still costs a full day of silence.
    runs-on: [self-hosted, nix, x86_64-linux]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # No actions/cache step here on purpose (bd-a5b044). Three independent reasons:
      #  1. `hashFiles()` is evaluated by spawning the runner's node20 external, which this
      #     Nix-packaged runner does not ship — it fails the whole job in ~9s with
      #     "The template is not valid ... No such file or directory".
      #  2. The key hashed **/Cargo.lock, and this library crate intentionally does not track
      #     Cargo.lock (see the windows job), so the key could never vary by dependency set.
      #  3. The step existed for EPHEMERAL azure runners that start empty. These runners are
      #     persistent, with a stable workdir (/var/lib/github-runner-workdirs/<runner>/...)
      #     and a stable HOME, so ~/.cargo and target/ already survive between runs.

      # The self-hosted nix runners ship no Rust toolchain on PATH, so the toolchain comes
      # from the flake devshell (nix develop) rather than a downloaded rustup toolchain
      # (which would not run under NixOS).
      - name: rustfmt
        run: nix develop --command cargo fmt --all --check

      - name: clippy
        # --all-targets also gives this repo its only Linux COMPILATION: the windows job
        # builds x86_64-pc-windows-msvc, so every #[cfg(unix)] block — set_executable's chmod
        # arm, exec_replace, the maybe_apply_staged_update re-exec, install_dir's HOME branch —
        # is fed to a compiler only here.
        run: nix develop --command cargo clippy --all-targets -- -D warnings

      - name: test
        run: nix develop --command cargo test

  windows:
    name: Windows compile + test
    # GitHub-hosted on purpose, but NOT because anything blocks self-hosted. The previous
    # comment here claimed updatable-cli was "not yet in collective's self-hosted Windows
    # runner allowlist"; that was the same dead premise that left the Unix lane dark for 17
    # days (bd-a5b044). No allowlist gates a repo-level runner, and this repo has six Windows
    # runners registered directly on it, all online:
    #   updatable-cli-win-ms-dev{,-2..-6}   [self-hosted, X64, Windows]
    #
    # So switching is an OPEN OPTION, not a blocked one — but it is unverified, so do not do
    # it blind. Those runners carry no `nix` label, and this job needs rustup plus a working
    # MSVC toolchain for the `host: x86_64-pc-windows-msvc` assertion below; whether either is
    # present there has never been tested. The actions/cache removal above is the cautionary
    # case: a step that was fine on GitHub-hosted died instantly on the Nix-packaged
    # self-hosted runners over a missing node20 external.
    #
    # To close the question at zero risk, trial it on a PR rather than on main — this workflow
    # already runs `on: pull_request`, so a PR flipping only this line to
    # `[self-hosted, X64, Windows]` proves or disproves it while main stays green.
    #
    # This lane is not broken: green on every commit in ~72s, and currently the only enforced
    # gate for `#[cfg(windows)]` code, which the Unix job cannot compile at all.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify native MSVC host
        shell: pwsh
        run: |
          rustc -vV
          if (-not ((rustc -vV) -match "host: x86_64-pc-windows-msvc")) {
            throw "expected native x86_64-pc-windows-msvc toolchain"
          }

      - name: Compile and test all targets
        shell: pwsh
        run: |
          # This is a library crate and intentionally does not track Cargo.lock.
          cargo test --all-targets
          cargo test --doc
